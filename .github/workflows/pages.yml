# The flasher page: builds the generic firmware (firmware/release.sh: secrets.example.h, never secrets.h) in the
# ESP-IDF image and publishes web/ with it to GitHub Pages (Settings > Pages > Source: GitHub Actions).
name: Flasher page

on: # main only: the github-pages environment lets just the default branch deploy
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: # one deployment at a time; a newer push waits rather than cancelling one mid-way
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, for the version (git describe)
          persist-credentials: false
      - name: Build the generic firmware
        run: sh firmware/release.sh
      - name: Build the screen editor demo
        run: sh web/build-editor.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
