# compose.yaml with the prebuilt image instead of a local build: nothing to compile.
#   docker compose -f compose.image.yaml up -d                                                  # start
#   docker compose -f compose.image.yaml pull && docker compose -f compose.image.yaml up -d     # update
services:
  deskpanel:
    image: ghcr.io/zebadrabbit/deskpanel-aggregator:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NOTES_FILE: /data/notes.json # notification history survives restarts
      # Light profiles saved from the panel go beside it, in /data/profiles.json (PROFILES_FILE in .env moves them).
      WEATHER_CACHE: /data/weather # radar basemap tiles survive restarts
      LAYOUT_FILE: /config/layout.json
    # Host networking, so health checks of services on this same host aren't dropped by its firewall; LISTEN in
    # .env (this machine's LAN address:8088) keeps it to the LAN.
    network_mode: host
    volumes:
      # The directory, not the socket file: a tailscaled restart recreates the socket.
      - /var/run/tailscale:/var/run/tailscale:ro
      - notes:/data
      # A directory, not the file: editors that save by renaming are still seen.
      - ./config:/config

volumes:
  notes:
